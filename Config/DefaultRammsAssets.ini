[CoreRedirects]
; The MeBot is RAMMP Gen1: its skeletal mesh, skeleton and physics asset were renamed (the root bone is still
; `mebot`). Here, with the plugin, so every project that uses it loads assets saved with the old names.
+PackageRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1")
+ObjectRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot.mebot",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1.rammp_gen1")
+PackageRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot_Skeleton",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1_Skeleton")
+ObjectRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot_Skeleton.mebot_Skeleton",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1_Skeleton.rammp_gen1_Skeleton")
+PackageRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot_PhysicsAsset",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1_PhysicsAsset")
+ObjectRedirects=(OldName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/mebot_PhysicsAsset.mebot_PhysicsAsset",NewName="/RammsAssets/Robots/RAMMP/Base/SkeletalMeshes/rammp_gen1_PhysicsAsset.rammp_gen1_PhysicsAsset")
